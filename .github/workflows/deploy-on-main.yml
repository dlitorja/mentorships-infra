name: Deploy on Main (Hooks)

on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]

jobs:
  trigger-deploys:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'main')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-on-main
      cancel-in-progress: false
    steps:
      # The verification step below runs a script from this repository, so the
      # job needs a checkout (it previously only made API calls).
      - uses: actions/checkout@v4

      - name: Compute context
        id: ctx
        run: |
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          echo "platformProject=mentorships-infra-platform" >> $GITHUB_OUTPUT
          echo "marketingProject=mentorships-infra-marketing" >> $GITHUB_OUTPUT
          echo "driveProject=mentorships-infra-huckleberry-drive" >> $GITHUB_OUTPUT

      - name: Check existing Platform deployment for commit
        id: check_platform
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ steps.ctx.outputs.sha }}
          PROJECT_NAME: ${{ steps.ctx.outputs.platformProject }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "vercel_token_present=false" >> $GITHUB_OUTPUT
            echo "No VERCEL_TOKEN; skipping pre-check for platform"; exit 0;
          fi
          resp=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?app=${PROJECT_NAME}&target=production&sha=${SHA}&limit=1") || resp='{"deployments":[]}'
          echo "API response (truncated): $(echo "$resp" | head -c 200)"
          count=$(node -e "const j=JSON.parse(process.argv[1]);console.log(Array.isArray(j.deployments)?j.deployments.length:0)" "$resp")
          if [ "$count" -gt 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Found existing Platform deployment for $SHA; will skip hook"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No Platform deployment found for $SHA; will trigger hook"
          fi

      - name: Trigger Platform Deploy Hook
        env:
          VERCEL_PLATFORM_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_PLATFORM_DEPLOY_HOOK_URL }}
        if: steps.check_platform.outputs.exists != 'true'
        run: |
          if [ -z "$VERCEL_PLATFORM_DEPLOY_HOOK_URL" ]; then
            echo "Missing secret: VERCEL_PLATFORM_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_PLATFORM_DEPLOY_HOOK_URL")
          echo "Platform HTTP Status: $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "202" ]; then
            echo "Platform deploy hook call failed" >&2
            exit 1
          fi

      - name: Check existing Marketing deployment for commit
        id: check_marketing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ steps.ctx.outputs.sha }}
          PROJECT_NAME: ${{ steps.ctx.outputs.marketingProject }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "vercel_token_present=false" >> $GITHUB_OUTPUT
            echo "No VERCEL_TOKEN; skipping pre-check for marketing"; exit 0;
          fi
          resp=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?app=${PROJECT_NAME}&target=production&sha=${SHA}&limit=1") || resp='{"deployments":[]}'
          echo "API response (truncated): $(echo "$resp" | head -c 200)"
          count=$(node -e "const j=JSON.parse(process.argv[1]);console.log(Array.isArray(j.deployments)?j.deployments.length:0)" "$resp")
          if [ "$count" -gt 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Found existing Marketing deployment for $SHA; will skip hook"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No Marketing deployment found for $SHA; will trigger hook"
          fi
      # NOTE: the secret name VERCEL_WEB_DEPLOY_HOOK_URL is legacy — it points at the
      # marketing project (formerly named mentorships-infra-web). Secret stores cannot be
      # renamed in place without editing them, so the name is kept as-is.
      - name: Trigger Marketing Deploy Hook
        env:
          VERCEL_WEB_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_WEB_DEPLOY_HOOK_URL }}
        if: steps.check_marketing.outputs.exists != 'true'
        run: |
          if [ -z "$VERCEL_WEB_DEPLOY_HOOK_URL" ]; then
            echo "Missing secret: VERCEL_WEB_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_WEB_DEPLOY_HOOK_URL")
          echo "Web HTTP Status: $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "202" ]; then
            echo "Web deploy hook call failed" >&2
            exit 1
          fi

      - name: Check existing Drive deployment for commit
        id: check_drive
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ steps.ctx.outputs.sha }}
          PROJECT_NAME: ${{ steps.ctx.outputs.driveProject }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "vercel_token_present=false" >> $GITHUB_OUTPUT
            echo "No VERCEL_TOKEN; skipping pre-check for drive"; exit 0;
          fi
          resp=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?app=${PROJECT_NAME}&target=production&sha=${SHA}&limit=1") || resp='{"deployments":[]}'
          echo "API response (truncated): $(echo "$resp" | head -c 200)"
          count=$(node -e "const j=JSON.parse(process.argv[1]);console.log(Array.isArray(j.deployments)?j.deployments.length:0)" "$resp")
          if [ "$count" -gt 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Found existing Drive deployment for $SHA; will skip hook"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No Drive deployment found for $SHA; will trigger hook"
          fi

      - name: Trigger Drive Deploy Hook
        env:
          VERCEL_DRIVE_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DRIVE_DEPLOY_HOOK_URL }}
        if: steps.check_drive.outputs.exists != 'true'
        run: |
          if [ -z "$VERCEL_DRIVE_DEPLOY_HOOK_URL" ]; then
            echo "Missing secret: VERCEL_DRIVE_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_DRIVE_DEPLOY_HOOK_URL")
          echo "Drive HTTP Status: $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "202" ]; then
            echo "::error::Drive deploy hook call failed with status $code"
            exit 1
          fi

      # The deploy hooks above only *start* a deployment, and the pre-checks skip
      # the hook entirely when the Git integration already produced one. Neither
      # path proved that the custom domain moved to the new commit: on
      # 2026-11-16 `dev.mentorships.huckleberry.art` stayed pinned to an
      # eight-hour-old deployment while four newer ones sat READY, so a merged
      # fix was never live. This step resolves each production alias, promotes
      # the commit's deployment when the alias is stale, and fails the run if it
      # still is not serving the SHA that passed CI.
      # Superseded runs are handled inside the script: it only promotes forward
      # (a deployment older than what the alias already serves is left alone), so
      # re-running CI for an old commit can never roll production back.
      # Projects Vercel skips on purpose are handled too: a monorepo commit that
      # does not touch `apps/<project>` cancels that project's build, and there
      # is nothing for the alias to serve. The script treats that — and only
      # that, detected via the deployment's monorepo-skip `errorLink` — as success.
      - name: Verify production aliases serve this commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          node .github/scripts/verify-production-alias.mjs \
            --sha "$SHA" \
            --team "$VERCEL_ORG_ID" \
            --project prj_Qcxbu6iZDxeUibBLGaydhOQ916pB --alias dev.mentorships.huckleberry.art \
            --project prj_3AXi02hFnBrl5ImGeC2X8HMxLuM2 --alias mentorships.huckleberry.art \
            --project prj_WUv8tG5QpcdpnQheQeBdUQXnooAF --alias drive.huckleberry.art
