name: Set Huckleberry Drive Turnstile Secret

on:
  workflow_dispatch:

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Vercel CLI
        run: npm install -g vercel@58.4.0

      - name: Set TURNSTILE_SECRET_KEY in Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DRIVE_PROJECT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          if [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "Missing secret: TURNSTILE_SECRET_KEY" >&2
            exit 1
          fi
          # Remove existing value first; vercel env add refuses to overwrite.
          vercel env rm TURNSTILE_SECRET_KEY production --yes || true
          printf '%s' "$TURNSTILE_SECRET_KEY" | vercel env add TURNSTILE_SECRET_KEY production
