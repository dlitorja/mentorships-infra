name: CI
# CI pipeline: codegen gate + typecheck + builds

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  convex-codegen:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_DEPLOYMENT: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - name: Convex codegen (push to main only)
        if: ${{ github.event_name == 'push' && env.CONVEX_DEPLOY_KEY != '' }}
        run: npx convex codegen
        env:
          CONVEX_DEPLOY_KEY: ${{ env.CONVEX_DEPLOY_KEY }}
          CONVEX_DEPLOYMENT: ${{ env.CONVEX_DEPLOYMENT }}
      - name: Skip codegen on PRs (avoid mutating prod deployment during review)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "Skipping convex codegen on pull_request: npx convex codegen uploads"
          echo "functions to the configured deployment, which on PRs would mutate"
          echo "the production Convex deployment during review. PRs verify the"
          echo "committed convex/_generated/ tree against the source via the"
          echo "downstream typecheck jobs (typecheck-convex and typecheck-apps)."
          echo ""
          echo "Trade-off: the typecheck jobs catch the most important staleness"
          echo "case — when a PR references a function that isn't in api.d.ts,"
          echo "tsc fails. They do NOT catch the inverse (api.d.ts exports a"
          echo "function the source no longer defines); those are dead exports"
          echo "that don't break tsc. A dev-deployment-based freshness check"
          echo "would close this gap but requires a non-prod Convex deployment"
          echo "that we don't have today; follow-up if/when one is provisioned."
      - name: Skip codegen (no deploy key)
        if: ${{ github.event_name != 'pull_request' && env.CONVEX_DEPLOY_KEY == '' }}
        run: |
          echo "Skipping convex codegen: missing CONVEX_DEPLOY_KEY"
      - name: Fail if codegen produced unstaged changes
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files changed; commit codegen artifacts."
            git diff --name-only
            exit 1
          fi

  typecheck-convex:
    runs-on: ubuntu-latest
    needs: convex-codegen
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - name: Typecheck Convex server
        run: pnpm run typecheck

  typecheck-apps:
    runs-on: ubuntu-latest
    needs: [convex-codegen]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - name: Typecheck apps/web
        run: pnpm --filter @mentorships/web run typecheck
      - name: Typecheck apps/platform
        run: NODE_OPTIONS=--max-old-space-size=4096 pnpm --filter @mentorships/platform run typecheck
      - name: Typecheck apps/huckleberry-drive
        run: pnpm --filter @mentorships/huckleberry-drive run typecheck
      - name: Typecheck apps/marketing
        run: pnpm --filter @mentorships/marketing run typecheck
      - name: Typecheck apps/marketing tests
        run: pnpm --filter @mentorships/marketing run typecheck:test

  build-apps:
    runs-on: ubuntu-latest
    needs: [typecheck-apps]
    # NEXT_PUBLIC_* values are inlined at Next.js compile time and end up in
    # every PR build artifact. Prefer repo vars/secrets for real environments
    # and fall back to localhost placeholders so PR builds never silently
    # point at production.
    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL || 'http://localhost:3210' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - name: Build apps/web
        run: pnpm --filter @mentorships/web run build
      - name: Build apps/platform
        run: pnpm --filter @mentorships/platform run build
      - name: Build apps/huckleberry-drive
        run: pnpm --filter @mentorships/huckleberry-drive run build
