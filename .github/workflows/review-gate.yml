name: Review Gate

# The required check on `main`, replacing a bare `Greptile Review` requirement.
#
# Why this exists: `main` required the `Greptile Review` status check, but
# `.greptile/config.json` lists markdown and lockfiles in `ignorePatterns` (those
# exclusions are the credit saving — see docs/greptile-cost-policy.md). A
# docs-only or lockfile-only PR therefore never receives that check and sits in
# BLOCKED forever, which is what happened on PR #1043. GitHub branch protection
# cannot express "required unless the diff is ignorable", so this workflow does.
#
# The gate passes when any of these hold:
#   1. every changed path matches Greptile's own `ignorePatterns` — markdown,
#      lockfiles, build output, generated files, docs/post-merge recaps; or
#   2. the PR carries `no-greptile` / `skip-greptile` (the documented opt-out
#      for CI-only, secret rotation, and experiment-revert PRs); or
#   3. the head commit has a green `Greptile Review` from Greptile's own GitHub
#      App. A same-named check from any other publisher does not count.
#
# It fails otherwise, printing the re-trigger instruction. Reviewing code is
# unchanged: a code PR still cannot merge without Greptile's sign-off.
#
# Polling is deliberate. A `check_run` trigger would fire on this workflow's own
# skipped runs and re-enter indefinitely, so the gate instead watches while a
# review is in flight and is re-run by `pull_request_review` when the finished
# review is actually posted.
#
# Known limitation: this is a discipline gate, not an authorization boundary. A
# PR that edits this file is evaluated by the edited version, so an author can
# widen the exemption — as they already can by applying `no-greptile`. Closing
# that needs CODEOWNERS or a gate that runs from the default branch, which is
# more machinery than a single-maintainer repo warrants. The audit trail is the
# PR diff itself.

on:
  pull_request:
    # `labeled`/`unlabeled` so applying or removing an opt-out label re-evaluates
    # the gate instead of leaving a stale failure behind.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # Re-evaluate when a review lands. This is what clears a gate that timed out
  # while waiting, and what lets `@greptileai review` re-baseline a failed gate.
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: Review Gate
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # Greptile's GitHub App id. Checks with the same name from any other
      # publisher are ignored.
      GREPTILE_APP_ID: "867647"
    steps:
      - name: Decide whether a Greptile review is required
        id: policy
        run: |
          set -euo pipefail
          head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          labels=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.labels[].name] | join(" ")')
          # filename<TAB>previous_filename, so a rename cannot hide reviewed
          # code behind an ignored path.
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | "\(.filename)\t\(.previous_filename // "")"')
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          if printf '%s\n' $labels | grep -qxE 'no-greptile|skip-greptile'; then
            echo "Opt-out label present: $labels"
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "reason=opt-out label present" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$files" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "reason=no changed files" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Mirror `.greptile/config.json` ignorePatterns. Greptile never reads
          # these paths, so requiring its check would deadlock the PR. Anything
          # not listed here still needs a review.
          is_ignorable() {
            case "$1" in
              *.md|*.MD) return 0 ;;
              pnpm-lock.yaml|*/pnpm-lock.yaml) return 0 ;;
              package-lock.json|*/package-lock.json) return 0 ;;
              yarn.lock|*/yarn.lock) return 0 ;;
              *.lock) return 0 ;;
              # Deliberately narrower than the config's `**/*.generated.*`: a
              # wildcard suffix would let an executable file opt out of review
              # by name. Convex codegen is the only generated tree we track.
              convex/_generated/*) return 0 ;;
              docs/post-merge/*) return 0 ;;
              node_modules/*|*/node_modules/*) return 0 ;;
              .next/*|*/.next/*) return 0 ;;
              .turbo/*|*/.turbo/*) return 0 ;;
              dist/*|*/dist/*) return 0 ;;
              build/*|*/build/*) return 0 ;;
              coverage/*|*/coverage/*) return 0 ;;
              .vercel/*|*/.vercel/*) return 0 ;;
              test-results/*|*/test-results/*) return 0 ;;
              playwright-report/*|*/playwright-report/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          ignorable=true
          while IFS=$'\t' read -r file previous; do
            [ -z "$file" ] && continue
            if ! is_ignorable "$file"; then
              ignorable=false
              break
            fi
            # Renaming `convex/x.ts` to `docs/x.md` leaves only the ignored path
            # in the file list, so judge the source path too.
            if [ -n "$previous" ] && ! is_ignorable "$previous"; then
              echo "Rename out of a reviewed path: $previous -> $file"
              ignorable=false
              break
            fi
          done <<< "$files"

          if [ "$ignorable" = true ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "reason=every changed path is in Greptile's ignorePatterns" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "reason=code changes need a Greptile review" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a green Greptile Review on the head commit
        if: steps.policy.outputs.required == 'true'
        env:
          HEAD_SHA: ${{ steps.policy.outputs.head_sha }}
        run: |
          set -euo pipefail
          sha="$HEAD_SHA"
          now=$(date +%s)
          # Greptile takes ~2-3 minutes to post after a PR event, so a missing
          # check is only fatal after a grace period. Once a review is running,
          # allow a generous window for large diffs.
          absent_deadline=$(( now + 420 ))
          hard_deadline=$(( now + 1800 ))

          read_state() {
            # Only Greptile's own App counts. Trusting the check name alone would
            # let any integration that can write commit statuses approve code.
            # A legacy commit-status fallback used to exist here; Greptile posts
            # check runs (verified on PR #1042), so it is gone rather than left
            # as an unauthenticated bypass.
            gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[]
                     | select(.name == "Greptile Review")
                     | select(.app.id == 867647)]
                    | sort_by(.started_at) | last
                    | if . == null then empty
                      else "\(.status):\(.conclusion // "")" end' 2>/dev/null || true
          }

          while :; do
            state=$(read_state)
            now=$(date +%s)

            case "$state" in
              completed:success)
                echo "Greptile Review is green on $sha."
                exit 0
                ;;
              # Greptile uses neutral for reviews that carry suggestions, and
              # skipped when the diff has nothing for it to read. Neither is a
              # failure, and blocking on them would recreate the deadlock.
              completed:neutral|completed:skipped)
                echo "Greptile Review concluded '${state##*:}' on $sha — not blocking."
                exit 0
                ;;
              in_progress:*|queued:*|waiting:*|pending:*)
                if [ "$now" -ge "$hard_deadline" ]; then
                  echo "::error::Greptile Review is still running on $sha after 30 minutes."
                  exit 1
                fi
                ;;
              completed:*)
                echo "::error::Greptile Review did not pass on $sha ($state)."
                echo "Address the findings, then comment '@greptileai review' to re-baseline."
                exit 1
                ;;
              "")
                if [ "$now" -ge "$absent_deadline" ]; then
                  echo "::error::No Greptile Review on $sha after 7 minutes."
                  echo "Greptile only reviews on PR open, so a commit pushed after the"
                  echo "first review has none. Comment '@greptileai review' to re-baseline"
                  echo "this diff, or apply 'no-greptile' if the change is not semantic."
                  exit 1
                fi
                ;;
              *)
                echo "::error::Unrecognised Greptile state '$state' on $sha."
                exit 1
                ;;
            esac

            sleep 20
          done

      - name: Summarise
        env:
          REQUIRED: ${{ steps.policy.outputs.required }}
          REASON: ${{ steps.policy.outputs.reason }}
        run: |
          {
            echo "### Review Gate"
            echo ""
            echo "- PR: #$PR_NUMBER"
            echo "- Greptile required: **$REQUIRED**"
            echo "- Reason: $REASON"
          } >> "$GITHUB_STEP_SUMMARY"
