name: Review Gate

# The required check on `main`, replacing a bare `Greptile Review` requirement.
#
# Why this exists: `main` required the `Greptile Review` status check, but
# `.greptile/config.json` lists markdown in `ignorePatterns` (that exclusion is
# the credit saving — see docs/greptile-cost-policy.md). A docs-only PR therefore
# never receives that check and sits in BLOCKED forever, which is what happened
# on PR #1043. GitHub branch protection cannot express "required unless the diff
# is docs", so this workflow expresses it instead.
#
# The gate passes when any of these hold:
#   1. every changed file is documentation (`docs/**` or `*.md`); or
#   2. the PR carries `no-greptile` / `skip-greptile` (the documented opt-out
#      for CI-only, secret rotation, and experiment-revert PRs); or
#   3. the head commit has a green `Greptile Review`.
#
# It fails otherwise, printing the re-trigger instruction. Reviewing code is
# unchanged: a code PR still cannot merge without Greptile's sign-off.
#
# Polling instead of a `check_run` trigger is deliberate. A `check_run` trigger
# fires on this workflow's own skipped runs and re-enters indefinitely; polling
# for the review it is waiting on has no such loop and no extra moving parts.

on:
  pull_request:
    # `labeled`/`unlabeled` so applying or removing an opt-out label re-evaluates
    # the gate instead of leaving a stale failure behind.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: Review Gate
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Decide whether a Greptile review is required
        id: policy
        run: |
          set -euo pipefail
          head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          labels=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.labels[].name] | join(" ")')
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          if printf '%s\n' $labels | grep -qxE 'no-greptile|skip-greptile'; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "reason=opt-out label present ($labels)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$files" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "reason=no changed files" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Documentation-only: docs/** or a Markdown file anywhere. Greptile
          # cannot review these (markdown is in ignorePatterns), so requiring
          # its check would deadlock the PR.
          docs_only=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|*.md|*.MD) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$files"

          if [ "$docs_only" = true ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "reason=documentation-only diff" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "reason=code changes need a Greptile review" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a green Greptile Review on the head commit
        if: steps.policy.outputs.required == 'true'
        run: |
          set -euo pipefail
          sha="${{ steps.policy.outputs.head_sha }}"
          now=$(date +%s)
          # Greptile takes ~2-3 minutes to post after a PR event, so a missing
          # check is only fatal after a grace period. Once a review is running,
          # allow a generous window for large diffs.
          absent_deadline=$(( now + 420 ))
          hard_deadline=$(( now + 1800 ))

          read_state() {
            # Greptile may report as a check run (GitHub App) or as a legacy
            # commit status. Return "<kind>:<state>" for the newest record.
            local check status
            check=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "Greptile Review")]
                    | sort_by(.started_at) | last
                    | "check:\(.status):\(.conclusion // "")"' 2>/dev/null || true)
            if [ -n "$check" ]; then
              echo "$check"
              return
            fi
            status=$(gh api "repos/$REPO/commits/$sha/status" \
              --jq '[.statuses[] | select(.context == "Greptile Review")]
                    | last | "status:\(.state)"' 2>/dev/null || true)
            echo "$status"
          }

          while :; do
            state=$(read_state)
            now=$(date +%s)

            case "$state" in
              check:completed:success|status:success)
                echo "Greptile Review is green on $sha."
                exit 0
                ;;
              # Greptile uses neutral for reviews that carry suggestions, and
              # skipped when the diff has nothing for it to read. Neither is a
              # failure, and blocking on them would recreate the deadlock.
              check:completed:neutral|check:completed:skipped)
                echo "Greptile Review concluded '${state##*:}' on $sha — not blocking."
                exit 0
                ;;
              check:in_progress:*|check:queued:*|check:waiting:*|check:pending:*|status:pending)
                if [ "$now" -ge "$hard_deadline" ]; then
                  echo "::error::Greptile Review is still running on $sha after 30 minutes."
                  exit 1
                fi
                ;;
              check:completed:*|status:failure|status:error)
                echo "::error::Greptile Review did not pass on $sha (${state})."
                echo "Address the findings, then comment '@greptileai review' to re-baseline."
                exit 1
                ;;
              "")
                if [ "$now" -ge "$absent_deadline" ]; then
                  echo "::error::No Greptile Review on $sha after 7 minutes."
                  echo "Greptile only reviews on PR open, so a commit pushed after the"
                  echo "first review has none. Comment '@greptileai review' to re-baseline"
                  echo "this diff, or apply 'no-greptile' if the change is not semantic."
                  exit 1
                fi
                ;;
              *)
                echo "::error::Unrecognised Greptile state '${state}' on $sha."
                exit 1
                ;;
            esac

            sleep 20
          done

      - name: Summarise
        run: |
          {
            echo "### Review Gate"
            echo ""
            echo "- PR: #$PR_NUMBER"
            echo "- Greptile required: **${{ steps.policy.outputs.required }}**"
            echo "- Reason: ${{ steps.policy.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
