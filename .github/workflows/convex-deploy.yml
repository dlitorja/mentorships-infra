name: Deploy Convex

on:
  push:
    branches:
      - main
    paths:
      - 'convex/**'
      - '!convex/_generated/**'
  workflow_dispatch:

jobs:
  reconcile-gate:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_DEPLOYMENT: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          install-args: ""
      - name: Verify instructorProfiles reconciliation against prod
        run: node scripts/check-reconciliation-status.mjs --prod --acceptance-file docs/post-merge/reconciliation-acceptance.json

  deploy:
    runs-on: ubuntu-latest
    needs: reconcile-gate
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_DEPLOYMENT: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          install-args: ""
      # convex >= 1.47 asks for confirmation before creating or changing an
      # index on a large table, because the deploy blocks until that index is
      # backfilled. `--yes` answers deploy prompts today, so this job is fine
      # as-is, but do not rely on it blindly: if a future PR adds an index to a
      # large table, prefer `staged: true` on the index (it backfills in the
      # background) or add `--skip-large-indexes-check` here deliberately.
      # https://docs.convex.dev/database/schemas#staged-validators
      - name: Deploy Convex
        run: pnpm exec convex deploy --yes
