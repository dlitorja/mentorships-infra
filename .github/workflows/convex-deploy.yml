name: Deploy Convex

on:
  push:
    branches:
      - main
    paths:
      - 'convex/**'
      - '!convex/_generated/**'
  workflow_dispatch:

jobs:
  reconcile-gate:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_DEPLOYMENT: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          install-args: ""
      - name: Verify instructorProfiles reconciliation against prod
        run: node scripts/check-reconciliation-status.mjs --prod --acceptance-file docs/post-merge/reconciliation-acceptance.json

  deploy:
    runs-on: ubuntu-latest
    needs: reconcile-gate
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_DEPLOYMENT: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          install-args: ""
      - name: Deploy Convex
        run: pnpm exec convex deploy --yes
