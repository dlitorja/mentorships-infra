name: Setup pnpm + Node + install
description: Checkout, install pnpm, setup Node with cache, and install deps. Used by all CI jobs to avoid boilerplate drift.

inputs:
  install-args:
    description: Extra args passed to pnpm install
    required: false
    default: "--frozen-lockfile"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install deps
      shell: bash
      run: pnpm install ${{ inputs.install-args }}
